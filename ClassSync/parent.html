<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClassSync — Parent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/portal.css">
</head>
<body class="portal-body">

<header class="topbar">
  <div class="topbar-brand">ClassSync</div>
  <div class="topbar-right">
    <span class="role-chip">Parent</span>
    <span class="user-name" id="userName">Mrs. Patel</span>
    <button class="logout-btn" id="logoutBtn">Log out</button>
  </div>
</header>

<main class="portal-main">

  <div class="page-head">
    <h1 id="childName">Your child's dashboard</h1>
    <p>CSE 5th Sem, Div A · Roll No. 2401202002</p>
  </div>

  <div class="portal-tabs" role="tablist" aria-label="Parent sections">
    <button type="button" class="portal-tab tab-a is-active" role="tab" aria-selected="true" data-tab="notifications">Notifications</button>
    <button type="button" class="portal-tab tab-b" role="tab" aria-selected="false" data-tab="attendance">Attendance Summary</button>
    <button type="button" class="portal-tab tab-c" role="tab" aria-selected="false" data-tab="marks">Child's Marks</button>
  </div>

  <!-- ===================== TAB 1: NOTIFICATIONS ===================== -->
  <section class="tab-panel" data-panel="notifications">
    <section class="inbox-card">
      <h2 class="section-title">Inbox</h2>
      <ul class="notif-list" id="notifList">
        <!-- rows injected by parent.js -->
      </ul>
    </section>
  </section>

  <!-- ===================== TAB 2: ATTENDANCE SUMMARY ===================== -->
  <section class="tab-panel" data-panel="attendance" hidden>
    <section class="summary-card">
      <div class="child-card">
        <div class="child-info">
          <h2 id="childNameCard">Aarav Patel</h2>
          <p>CSE 5th Sem, Div A · Roll No. 2401202002</p>
        </div>
        <div class="child-pct">
          <span class="big-number" id="childPct">—</span>
          <span class="stat-label">overall<br>attendance</span>
        </div>
      </div>

      <div class="subject-bars" id="childSubjectBars">
        <!-- rows injected by parent.js -->
      </div>
    </section>
  </section>

  <!-- ===================== TAB 3: CHILD'S MARKS ===================== -->
  <section class="tab-panel" data-panel="marks" hidden>
    <section class="inbox-card">
      <h2 class="section-title">Marks</h2>
      <ul class="marks-view-list" id="childMarksList">
        <!-- rows injected by parent.js -->
      </ul>
    </section>
  </section>

</main>

<script src="js/script.js"></script>
<script src="js/parent.js"></script>
</body>
</html>
